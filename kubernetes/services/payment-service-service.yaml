apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - name: http
    port: 80
    targetPort: 8084
    protocol: TCP
  - name: actuator
    port: 8085
    targetPort: 8085
    protocol: TCP
  type: ClusterIP