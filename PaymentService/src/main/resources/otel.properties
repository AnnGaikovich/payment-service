# OpenTelemetry Configuration for PaymentService
otel.service.name=payment-service
otel.resource.attributes=service.name=payment-service,service.version=1.0,deployment.environment=${spring.profiles.active:local}

# Tracing
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.sampler=traceidratio
otel.traces.sampler.arg=1.0

# Metrics
otel.metrics.exporter=none

# Logs correlation
otel.javaagent.experimental.log-capture.enabled=true
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=*

# Instrumentations
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.jdbc-datasource.enabled=true
otel.instrumentation.hibernate.enabled=true
otel.instrumentation.redis.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.spring-webflux.enabled=true