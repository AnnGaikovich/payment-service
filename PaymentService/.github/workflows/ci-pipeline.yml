name: CI Pipeline for PaymentService

on:
  push:
    branches: [ main, feature/payment-service ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payment_service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run tests with coverage
        run: mvn clean verify jacoco:report
        env:
          DB_URL: jdbc:postgresql://localhost:5432/payment_service_db
          DB_USERNAME: postgres
          DB_PASSWORD: 123456
          SERVER_PORT: 8084
          USER_SERVICE_URL: http://localhost:8080
          ORDER_SERVICE_URL: http://localhost:8081
          USER_SERVICE_API_KEY: internal-auth-key-12345

      - name: Run integration tests (optional)
        if: success()
        run: |
          if [ -f "src/test/resources/application-integration.yml" ]; then
            mvn verify -Pintegration-tests \
              -Dspring.profiles.active=integration \
              -MONGODB_URI=mongodb://localhost:27017/payment_service_db
              -MONGODB_USERNAME=root
              -MONGODB_PASSWORD=123456
          else
            echo "No integration tests configuration found"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t orderservice:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d \
            --name payment-service-test \
            -p 8084:8084 \
            -e DB_URL=jdbc:postgresql://localhost:5432/payment_service_db \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=123456 \
            paymentservice:${{ github.sha }
          
          sleep 20
          
          curl -f http://localhost:8084/actuator/health || exit 1
          
          docker stop payment-service-test
          docker rm payment-service-test

      
